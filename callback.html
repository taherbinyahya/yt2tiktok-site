<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>yt2tiktok – Login</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #1b2a3a; background: #fff; }
  textarea { width: 100%; box-sizing: border-box; height: 7em; font: 13px ui-monospace, Menlo, monospace; padding: 8px; }
  button { font-size: 1rem; padding: 10px 20px; margin-top: 8px; cursor: pointer; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1 id="title">TikTok login received</h1>
<p id="msg">Copy this whole address and paste it into the yt2tiktok tool, where it says <strong>Redirected URL</strong>.</p>
<textarea id="url" readonly></textarea>
<button id="copy">Copy</button>
<script>
  const q = new URLSearchParams(location.search);
  // Logins started from the yt2tiktok web page go straight back to it on this computer.
  if ((q.get("state") || "").startsWith("local-")) {
    location.replace("http://localhost:8765/tiktok/callback" + location.search);
  }
  const box = document.getElementById("url");
  box.value = location.href;
  if (q.has("error")) {
    document.getElementById("title").textContent = "TikTok login was not completed";
    const msg = document.getElementById("msg");
    msg.className = "err";
    msg.textContent = "TikTok said: " + (q.get("error_description") || q.get("error")) + ". Paste the address into the tool anyway; it will show the details.";
  }
  document.getElementById("copy").onclick = async () => {
    box.select();
    try { await navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand("copy"); }
    document.getElementById("copy").textContent = "Copied ✓";
  };
</script>
</body>
</html>
